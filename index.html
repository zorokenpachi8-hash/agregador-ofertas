<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Ofertas | Promos Flash</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-red-600 text-white py-4 shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
        🔥 Radar de Ofertas
      </h1>
      <span class="text-xs bg-red-800 px-2.5 py-1 rounded-full font-semibold">
        Atualizado 24h
      </span>
    </div>
  </header>

  <!-- Container Principal -->
  <main class="container mx-auto px-4 py-6 flex-grow">
    
    <div class="mb-6 text-center">
      <h2 class="text-2xl font-bold text-gray-900">Ofertas Imperdíveis do Dia</h2>
      <p class="text-sm text-gray-600 mt-1">As melhores promoções da Amazon e Shopee selecionadas para você</p>
    </div>

    <!-- Status de Carregamento -->
    <div id="loading" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-600 border-t-transparent"></div>
      <p class="text-sm text-gray-500 mt-2">Buscando melhores preços...</p>
    </div>

    <!-- Grid de Ofertas -->
    <div id="grid-ofertas" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 hidden">
      <!-- Cards serão inseridos via JavaScript -->
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 mt-auto">
    <p>© 2026 Radar de Ofertas - Os preços podem variar no site do anunciante.</p>
  </footer>

  <!-- Script de Conexão com o Backend -->
  <script>
    const API_URL = 'https://agregador-ofertas-backend.onrender.com/api/ofertas';

    async function carregarOfertas() {
      const container = document.getElementById('grid-ofertas');
      const loading = document.getElementById('loading');

      try {
        const response = await fetch(API_URL);
        const ofertas = await response.json();

        loading.classList.add('hidden');
        container.classList.remove('hidden');
        container.innerHTML = '';

        if (ofertas.length === 0) {
          container.innerHTML = '<p class="col-span-full text-center text-gray-500">Nenhuma oferta encontrada no momento.</p>';
          return;
        }

        ofertas.forEach(oferta => {
          const card = `
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
              <img src="${oferta.imagem}" alt="${oferta.titulo}" class="w-full h-48 object-cover">
              <div class="p-4 flex flex-col flex-grow">
                <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-2">${oferta.titulo}</h3>
                <div class="mt-auto">
                  <p class="text-xs text-gray-500">A partir de</p>
                  <p class="text-xl font-bold text-green-600">${oferta.preco}</p>
                  <a href="${oferta.link}" target="_blank" rel="noopener noreferrer" 
                     class="mt-3 block text-center bg-red-600 hover:bg-red-700 text-white font-medium py-2 rounded-lg text-sm transition">
                    Ver Promoção
                  </a>
                </div>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });

      } catch (erro) {
        console.error('Erro ao carregar ofertas:', erro);
        loading.innerHTML = '<p class="text-red-500 text-sm">Não foi possível carregar as ofertas. Tente novamente mais tarde.</p>';
      }
    }

    // Inicializa ao carregar a página
    carregarOfertas();
  </script>
</body>
</html>
